name: Prepare aggregated profile stats

# No push, pull_request, pull_request_target or workflow_run.
# Manual preview only. Scheduling is absent; publishing is hard-disabled.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-stats-main
  cancel-in-progress: false

jobs:
  generate:
    # PROFILE_STATS_ENABLED must be a repository variable, not environment-only.
    if: >-
      github.repository == 'paesdj1987/paesdj1987' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'paesdj1987' &&
      github.ref == 'refs/heads/main' &&
      vars.PROFILE_STATS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: profile-stats-read
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed workflow revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Generate and validate aggregates
        env:
          PROFILE_STATS_READ_TOKEN: ${{ secrets.PROFILE_STATS_READ_TOKEN }}
          PUBLIC_API_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_stats.py generate --directory "$RUNNER_TEMP/profile-cards"

      # This action receives no PAT. Only the two validated SVGs are uploaded.
      - name: Upload cards for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: profile-cards
          path: |
            ${{ runner.temp }}/profile-cards/stats.svg
            ${{ runner.temp }}/profile-cards/top-langs.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    # Requires an explicit, separately reviewed source change before activation.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Configure an approval here. This environment must not contain the read PAT.
    environment: profile-stats-publish
    permissions:
      contents: write
    steps:
      - name: Checkout the same reviewed revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download this run's cards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: profile-cards
          path: ${{ runner.temp }}/validated-cards

      - name: Validate again and activate README card paths
        run: python3 scripts/profile_stats.py prepare --directory "$RUNNER_TEMP/validated-cards"

      - name: Publish only the reviewed outputs with repository-scoped credentials
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          # No PAT is present in this job. Do not persist the ephemeral credential.
          auth="$(printf 'x-access-token:%s' "$GH_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo '::error::main changed since dispatch; regenerate from the new main. Nothing published.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md profile/stats.svg profile/top-langs.svg
          python3 scripts/profile_stats.py verify-index --directory profile
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'docs: update aggregated profile statistics'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
